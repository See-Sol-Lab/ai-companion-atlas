name: Validate project catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate project catalog
        run: node scripts/generate-projects.mjs
      - name: Run tests
        run: node --test tests/comments.test.mjs
      - name: Verify generated files are committed
        run: git diff --exit-code
