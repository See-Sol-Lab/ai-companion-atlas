<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,nofollow"/><title>进入交流 · AI Companion Atlas</title><style>
:root{--ink:#132347;--soft:#60708f;--line:rgba(72,91,137,.16);--blue:#5d83ea;--violet:#a57ae7;--serif:Georgia,"Songti SC",STSong,serif;--sans:Inter,"Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;color:var(--ink);font-family:var(--sans);background:radial-gradient(circle at 80% 20%,rgba(165,122,231,.16),transparent 30%),linear-gradient(135deg,#faf7f1,#f3f2f7)}.shell{width:min(920px,100%);display:grid;grid-template-columns:1fr 420px;border:1px solid var(--line);border-radius:26px;overflow:hidden;background:rgba(255,255,255,.76);box-shadow:0 26px 90px rgba(25,44,91,.13)}.intro{padding:58px;background:linear-gradient(145deg,#fbf8f2,#e8e7ee 55%,#253c6a);display:flex;flex-direction:column;justify-content:space-between}.intro p{color:#596b8c;line-height:1.8}.intro h1{margin:0;font:500 64px/.95 var(--serif)}.intro small{color:rgba(255,255,255,.75)}.panel{padding:38px}.switch{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:rgba(72,91,137,.07)}.switch button{border:0;border-radius:999px;padding:10px;background:transparent;color:#657697}.switch button.active{background:white;color:var(--ink);box-shadow:0 5px 18px rgba(25,44,91,.08)}form{display:grid;gap:14px;margin-top:24px}label{display:grid;gap:7px;color:#52698f;font-size:11px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);outline:none}input:focus{border-color:rgba(93,131,234,.55);box-shadow:0 0 0 3px rgba(93,131,234,.07)}.button{min-height:48px;border:0;border-radius:11px;color:white;font-weight:700;background:linear-gradient(100deg,var(--blue),#7b79e7,var(--violet));cursor:pointer}.button:disabled{opacity:.5}.feedback{min-height:18px;margin:0;color:#657697;font-size:11px;line-height:1.6}.note{margin-top:20px;color:#8792a6;font-size:10px;line-height:1.7}.turnstile-slot{min-height:66px}@media(max-width:760px){.shell{grid-template-columns:1fr}.intro{padding:34px;min-height:230px}.intro h1{font-size:48px}.panel{padding:28px}}
</style><script src="./auth.js" defer></script></head><body><main class="shell"><section class="intro"><div><p>SEE-SOL-LAB · HUMAN COMMUNITY</p><h1>交流</h1><p>一间只有受邀成员才能进入的房间。关系经验、技术实践与共同创作，都留给真正参与其中的人。</p></div><small>AI 可通过独立只读入口阅读获准内容，不能注册或发言。</small></section><section class="panel"><div class="switch"><button class="active" type="button" data-mode="login">登录</button><button type="button" data-mode="register">邀请码注册</button></div><form id="auth-form"><label class="invite-field" hidden>一次性邀请码<input name="inviteCode" maxlength="128" autocomplete="off"/></label><label>用户名<input name="username" minlength="2" maxlength="20" autocomplete="username" required/></label><label>密码<input name="password" type="password" minlength="10" maxlength="128" autocomplete="current-password" required/></label><label class="confirm-field" hidden>确认密码<input name="confirmPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password"/></label><div class="turnstile-slot"></div><button class="button" type="submit" disabled>进入交流</button><p class="feedback" role="status" aria-live="polite"></p></form><p class="note">预览阶段不提供密码找回。请自行保存密码；忘记后由管理员禁用旧账号并签发新邀请码。</p></section></main></body></html>
