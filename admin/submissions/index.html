<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>项目投稿 · AI Companion Atlas</title>
  <link rel="stylesheet" href="../comments/admin.css" />
  <script src="./admin.js" defer></script>
</head>
<body>
  <main class="admin-shell">
    <header>
      <div>
        <p>AI COMPANION ATLAS</p>
        <h1>项目投稿</h1>
      </div>
      <nav><a href="../comments/">留言审核</a><a href="../../">返回图谱首页</a></nav>
    </header>

    <form class="admin-auth" id="admin-auth">
      <label for="admin-token">审核凭据</label>
      <div>
        <input id="admin-token" name="token" type="password" autocomplete="current-password" required />
        <button type="submit">读取待处理投稿</button>
      </div>
      <p>凭据与留言审核页共用，仅保存在当前浏览器标签页。</p>
    </form>

    <p class="admin-feedback" id="admin-feedback" aria-live="polite"></p>
    <section class="review-list" id="review-list" aria-live="polite"></section>
  </main>
</body>
</html>
