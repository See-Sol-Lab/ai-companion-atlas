<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>社区审核 · AI Companion Atlas</title>
  <link rel="stylesheet" href="../comments/admin.css" />
  <script src="./admin.js" defer></script>
</head>
<body>
  <main class="admin-shell">
    <header>
      <div><p>AI COMPANION ATLAS</p><h1>社区审核</h1></div>
      <nav><a href="../comments/">项目留言</a><a href="../submissions/">项目投稿</a><a href="../../community/">返回交流</a></nav>
    </header>

    <form class="admin-auth" id="admin-auth">
      <label for="admin-token">审核凭据</label>
      <div><input id="admin-token" name="token" type="password" autocomplete="current-password" required /><button type="submit">读取待审核内容</button></div>
      <p>凭据与其他审核页共用，仅保存在当前浏览器标签页。</p>
    </form>

    <p class="admin-feedback" id="admin-feedback" aria-live="polite"></p>
    <section class="review-list" id="review-list" aria-live="polite"></section>
  </main>
</body>
</html>
